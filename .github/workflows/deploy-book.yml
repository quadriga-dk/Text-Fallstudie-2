name: deploy-book

# Run this when the master or main branch changes
on:
  workflow_run:
    workflows: ["Update Metadata"]
    types:
      - completed
    branches:
      - main

# This job installs dependencies, builds the book, and deploys it to GitHub Pages
# only runs if "Update Metadata" workflow is successful
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    # Install dependencies
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # Build the book
    - name: Build the book
      run: |
        jupyter-book build .

    - name: Inject all metadata into HTML
      run: |
        python -m quadriga.metadata.inject_all_metadata
        echo "Injected all metadata (OpenGraph, JSON-LD, and RDF links) into HTML head"

    - name: Copy metadata files to build directory
      run: |
        cp quadriga-metadata.jsonld _build/html/quadriga-metadata.jsonld
        cp quadriga-metadata.rdf _build/html/quadriga-metadata.rdf
        echo "Copied metadata files to _build/html for discovery"

    # Upload the book's HTML as an artifact
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: "_build/html"

    # Deploy the book's HTML to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
