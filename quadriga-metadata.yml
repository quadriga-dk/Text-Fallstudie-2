- title: Fragestellung und Operationalisierung. Einführung in die Fallstudie
  description: Dieses Kapitel bildet den Auftakt der Fallstudie und dient der Klärung
    des Erkenntnisinteresses, das die dann folgende Vorbereitung und Aufbereitung
    des Forschungsgegenstands (Korpus) und schließlich die Analyse leitet.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/research_question/research-question_intro.html
  timeRequired: TODO
  learningGoal: Grundlagen korpusbasierter geisteswissenschaftlicher Forschung
  learningObjectiveLIST:
  - description: Die Entwicklung einer Digital Humanities-Fragestellung kann am Beispiel
      der kommunikativen Barrierearmut des Berliner Senats nachvollzogen und erläutert
      werden.
    competency: nicht anwendbar
    dataFlow: nicht anwendbar
    bloomsCategory: 2 Verstehen
  - description: Der Operationalisierungsprozess kann am Beispiel der Kopplung von
      Barrierearmut an Leichte Sprache und Lesbarkeitsindizes nachvollzogen und auf
      andere Forschungsfragen übertragen werden.
    competency: 1.1 Identifikation
    dataFlow: 1 Planung
    bloomsCategory: 3 Anwenden
- title: Korpora als epistemische Objekte
  description: In diesem Kapitel nehmen wir zunächst eine Sicherung des Begriffsverständnisses
    vor und klären entsprechend, was wir mit dem Begriff „Korpus“ meinen und welche
    unterschiedlichen Typen des Korpusaufbaus es gibt.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/corpus_collection/corpus-collection_intro.html
  timeRequired: TODO
  learningGoal: Ansätze des Korpusaufbaus und Erstellung basaler Metadaten
  learningObjectiveLIST:
  - description: Korpora können als geisteswissenschaftliche Forschungsobjekte definiert
      und deren wesentliche Merkmale beschrieben werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 2 Verstehen
  - description: Die grundlegenden Metadatenschemata (Dublin Core, TEI, MODS, METS)
      und deren charakteristische Elemente für Korpora und Einzeldokumente können
      beschrieben werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 2 Verstehen
  - description: Der schrittweise Prozess des praktischen Korpusaufbaus (Konzeptentwicklung,
      Metadatenerstellung und Datensammlung) kann am Beispiel eines Korpus von Pressemitteilungen
      beschrieben werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 2 Verstehen
- title: Texte als digitale Objekte. Einführung in HTML
  description: Da der Senat die Pressemitteilungen in Form von Websites veröffentlicht,
    diese aber meist noch weitere Informationen enthalten, geht es in diesem Kapitel
    darum, wie der Text einer Website strukturiert extrahiert werden kann.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/html_intro/html-intro_intro.html
  timeRequired: TODO
  learningGoal: Textformate und Textextraktion aus HTML
  learningObjectiveLIST:
  - description: Vier Formate digitaler Texte (Bilddigitalisate, Plain Text, HTML,
      CSV) können anhand ihrer charakteristischen Eigenschaften unterschieden und
      deren Vor- und Nachteile für spezifische Anwendungsfälle analysiert werden.
    competency: 2.3 Aufbereitung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 4 Analysieren
  - description: Die Struktur von HTML-Websites kann erklärt und die Funktion ausgewählter
      HTML-Tags benannt werden.
    competency: 2.3 Aufbereitung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 2 Verstehen
  - description: Die Extraktion von Plain Text aus HTML kann nachvollzogen und die
      wichtigsten HTML-Tags zur Extraktion aufgezählt werden.
    competency: 2.1 Erhebung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 2 Verstehen
- title: Scraping als Methode zum Korpusaufbau
  description: In diesem Kapitel geht es um die automatisierten Extraktion, dem sogenannten
    Scraping, von Webinhalten zur Erstellung des Forschungskorpus.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/scraping_intro/scraping_intro.html
  timeRequired: TODO
  learningGoal: Scraping als Methode zur Korpuserstellung
  learningObjectiveLIST:
  - description: HTTP-Abfragen können konzeptionell erklärt, die beteiligten Komponenten
      aufgezählt und die Response-Codes 200, 404, 403 und 500 erläutert werden.
    competency: 2.1 Erhebung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 2 Verstehen
  - description: Verschiedene Methoden zur automatisierten Abfrage von Websites können
      unterschieden sowie deren Vor- und Nachteile benannt werden.
    competency: 2.1 Erhebung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 2 Verstehen
- title: Korpusaufbau
  description: Nachdem wir uns mit HTTP-Anfragen, Web-Scraping und HTML beschäftigt
    haben, kombinieren wir in diesem Kapitel dieses Wissen, um den Korpus von mehr
    als 50.000 Pressemitteilungen von berlin.de zusammenzustellen.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/corpus_building/corpus-building_intro.html
  timeRequired: TODO
  learningGoal: Scraping-basierte Korpuserstellung
  learningObjectiveLIST:
  - description: Die Schritte zur automatisierten Korpuserstellung mittels HTML-Analyse
      und Scraping können nachvollzogen und die Unterschiede zwischen Ursprungs- und
      Zielformat (HTML und Plain Text) erklärt werden.
    competency: 2.1 Erhebung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 2 Verstehen
  - description: Die Vollständigkeit und Qualität des gescrapten Korpus können anhand
      der erhobenen Metadaten (etwa Dokumentzahl, Zeitabdeckung, Tokenanzahl) geprüft
      und Auffälligkeiten analysiert werden.
    competency: 2.2 Validierung
    dataFlow: 2 Erhebung und Aufbereitung
    bloomsCategory: 4 Analysieren
- title: Korpusanalyse. Textkomplexität
  description: Nachdem wir im vorherigem Kapitel ein Korpus gescraped und aus den
    HTML-Dokumenten den Text extrahiert haben, analysieren wir das Textkorpus in diesem
    Kapitel in Hinblick auf die Textkomplexität.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/corpus_analysis/corpus-analysis_intro.html
  timeRequired: TODO
  learningGoal: Berechnung und Visualisierung der Textkomplexität
  learningObjectiveLIST:
  - description: Komponenten zur Berechnung von Textkomplexität können aufgezählt
      und gängige Lesbarkeitsindizes benannt werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 2 Verstehen
  - description: Die notwendigen Schritte zur Berechnung der Textkomplexität auf einem
      Korpus können aufgezählt, die Konzeption der diachronen Analyse beschrieben
      und alternative Möglichkeiten der Korpusaufteilung entworfen werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 2 Verstehen
  - description: Das Konzept des Liniendiagramms kann erklärt, gegen das Balkendiagramm
      abgegrenzt und die Eignung beider Darstellungsformen für zeitliche Entwicklungen
      begründet werden.
    competency: 4.2 Visualisierung
    dataFlow: 4 Analyse
    bloomsCategory: 4 Analysieren
  - description: Die Entwicklung der Textkomplexität kann in unterschiedlicher zeitlicher
      Granularität (Woche, Monat, Jahr) interpretiert werden.
    competency: 4.3 Interpretation
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
- title: Reflexion
  description: Mit der Analyse der Textkomplexität haben wir den in dieser Fallstudie
    entwickelten Meßvorgang abgeschlossen. Dieser Befund bedarf allerdings der Einordnung.
    Ein Ergebnis ist nur so tragfähig wie die Operationalisierung, die ihm zugrunde
    liegt, und jede Operationalisierung in den Digital Humanities ist, wie wir bereits
    im Kapitel Operationalisierung angemerkt haben, diskutabel. Wir treten daher zum
    Abschluss einen Schritt zurück und reflektieren Reichweite und Grenzen unseres
    Vorgehens.
  url: https://quadriga-dk.github.io/Text-Fallstudie-2/reflection/reflection_reflection.html
  timeRequired: TODO
  learningGoal: Kritische Bewertung der Reichweite und Limitationen
  learningObjectiveLIST:
  - description: Die methodischen Limitationen einer Digital Humanities-Fallstudie
      können benannt werden.
    competency: 4.3 Interpretation
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
  - description: Die Reichweite des Befunds kann im Rahmen der gewählten Operationalisierung
      eingeordnet und ein beobachteter Trend von einer Ursachenaussage unterschieden
      werden.
    competency: 4.3 Interpretation
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
